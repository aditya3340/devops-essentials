apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizers.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./production-projects/app/helm-charts/loki
    repoURL: https://github.com/aditya3340/devops-essentials/
    targetRevision: dev
    helm:
      releaseName: loki
      valueFiles:
        - values.yaml
        - overrides.yaml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true

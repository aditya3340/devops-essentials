# monitoring/apps/loki-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 2.10.3

    chart: loki-stack
    helm:
      valueFiles:
        - production-projects/app/argo-apps/apps/loki-stack-values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
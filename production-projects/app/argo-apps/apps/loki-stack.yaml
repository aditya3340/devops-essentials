# monitoring/apps/loki-stack.yaml (Corrected for Local Chart)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/aditya3340/devops-essentials/
    # 1. Use the Git branch/tag where the chart files reside
    targetRevision: dev 
    
    # 2. Point to the local directory where the loki-stack chart was pulled
    path: production-projects/app/argo-apps/charts/loki-stack 
    
    # 3. REMOVE the 'chart' field when using 'path'
    
    helm:
      valueFiles:
        # 4. Use the full path for the values file
        - production-projects/app/argo-apps/apps/loki-stack-values.yaml
      
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
# ... (rest of sync policy is fine)
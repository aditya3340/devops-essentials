apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{.Values.environment}}
  namespace: {{.Release.Namespace}}
  labels:
    app: {{.Release.Name}}
spec:
  replicas: {{.Values.frontend.replicas}}
  selector:
    matchLabels:
      app: {{.Release.Name}}
  template:
    metadata:
      labels:
        app: {{.Release.Name}}
    spec:
      containers:
        - name: {{.Values.frontend.containerName}}
          image: {{.Values.frontend.imageRepository}}:{{.Values.frontend.imageTag}}
          ports:
            - containerPort: {{.Values.service.http.containerPort}}
              name: {{.Values.service.http.containerPortName}}
            
    

## Corrected values.yaml for the local loki-stack chart

# Fixes: Nil pointer error (looks for .Values.test_pod.enabled)
test_pod:
  enabled: false

# Fixes: Chart dependency error (sometimes uses 'test' instead of 'test_pod')
test:
  enabled: false
  
loki:
  enabled: true
  
  # Fixes: Wrong type/missing value error (.Values.loki.url)
  # This is the internal service URL for Grafana to connect to Loki.
  url: http://loki:3100/loki/api/v1/push

  datasource:
    uid: loki-datasource
  
  # Your custom settings
  isDefault: true # Make Loki the default datasource in Grafana
  deployment:
    replicas: 1
  persistence:
    enabled: true
    size: 1Gi # Your requested size
    storageClassName: standard # Use a standard StorageClass for Minikube/default cluster setup

promtail:
  # CRITICAL: Disable Promtail since you will deploy Grafana Alloy separately
  enabled: true

grafana:
  enabled: true
  
  # Admin credentials (change these to secrets in a real setup!)
  adminUser: admin
  # You should use a secret to store the password
  adminPassword: changeme_password 
  
  # Configure the datasource via sidecar to auto-discover Loki
  sidecar:
    datasources:
      enabled: true
      
  # Persistence for Grafana data (dashboards, users, etc.)
  persistence:
    enabled: true
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    
  # Enable Ingress (if you have an ingress controller deployed)
  ingress:
    enabled: false
    
# Allow the whole stack to access resources if needed (e.g., if RBAC is strict)
serviceAccount:
  create: true
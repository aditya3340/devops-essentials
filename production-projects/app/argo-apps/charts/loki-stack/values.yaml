## Minimal values.yaml for Loki + Grafana (Disabling everything else)

# Fixes: Chart required settings
test_pod:
  enabled: false
test:
  enabled: false

# ----------------- Loki (Core) -----------------
loki:
  enabled: true
  
  # Fixes: Datasource template requirement
  url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  datasource:
    uid: loki-datasource 

  isDefault: true
  deployment:
    replicas: 1
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard

# ----------------- Grafana (Visualization) -----------------
grafana:
  enabled: true
  adminUser: admin
  adminPassword: changeme_password # CHANGE THIS!
  service:
    type: NodePort # Keeps your existing NodePort setup
    nodePort: 32000 
  sidecar:
    datasources:
      enabled: true
  persistence:
    enabled: true
    size: 1Gi

rbac:
  create: true
  
# Also ensure serviceAccount is created (it probably is, but confirm)
serviceAccount:
  create: true

# ----------------- Disabled Components -----------------

# Disable all metrics collectors/server
prometheus:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
  
# Disable all log collectors (You will use Alloy)
promtail:
  enabled: false
filebeat:
  enabled: false
fluent-bit:
  enabled: false
logstash:
  enabled: false

# Disable Alerting
alertmanager:
  enabled: false
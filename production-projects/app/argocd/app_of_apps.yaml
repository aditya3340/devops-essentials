# app-of-apps.yaml (Optimized)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/component: root
    app.kubernetes.io/managed-by: argocd
  finalizers:
  - resources-finalizers.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/aditya3340/devops-essentials.git
    targetRevision: dev
    path: ./                  # Search from the repository root
    directory:
      recurse: true
      include: | 
        production-projects/app/cluster-addons/monitoring/apps/loki-stack.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # Use recommended App-of-Apps options:
    - ApplyOutOfSyncOnly=true       # Only sync when actually OutOfSync (reduces traffic)
    - RespectIgnoreDifferences=true # Good practice for managing infrastructure

    #  production-projects/app/services/*.yaml
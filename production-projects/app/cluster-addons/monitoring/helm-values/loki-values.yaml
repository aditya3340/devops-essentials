loki:
  storage:
    type: 'filesystem'
  
  config:
    chunk_store_config:
      max_look_back_period: 0s
  
  table_manager:
    retention_deletes_enabled: true
    retention_period: 336h
  

  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 256Mi


affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: Exists

persistence:
  enabled: true
  size: 1Gi # Adjust size based on expected log volume
  storageClassName: standard # Use the default Minikube storage class
  accessModes:
    - ReadWriteOnce

# Expose Loki's service if needed, ClusterIP is usually enough for Promtail
service:
  type: ClusterIP
  port: 3100

  
  
---
loki:
  enabled: false
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: true
  pattern_ingester:
      enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4
  storage:
    use_thanos_objstore: false
    bucketNames:
      chunks: "chunks"
      ruler: "ruler"

minio:
  enabled: true
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: 512MiB

monitoring:
  dashboards:
    enabled: false
  serviceMonitor:
    enabled: false
    metricsInstance: {}
  selfMonitoring:
    enabled: false
    tenant:
      name: ""
    grafanaAgent:
      priorityClassName: ""
    podLogs: {}
  rules: {}

chunksCache:
  # default is 500MB, with limited memory keep this smaller
  writebackSizeLimit: 10MB


# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0